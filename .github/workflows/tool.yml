name: One-off tool

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Script in src/tools/ to run (without .js)'
        required: true
      args:
        description: 'Optional arguments for the script (e.g. a date)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: node src/tools/${{ github.event.inputs.tool }}.js ${{ github.event.inputs.args }}
      - name: Save results
        run: |
          git config user.name "whalers-scan"
          git config user.email "whalers-scan@users.noreply.github.com"
          git add -A data/adhoc; for f in data/form.json data/pool.json; do [ -f $f ] && git add $f; done
          git diff --cached --quiet || git commit -m "tool ${{ github.event.inputs.tool }} $(date -u +%F)"
          git checkout -- state 2>/dev/null; git clean -fdq state 2>/dev/null; git pull --rebase -q && git push
