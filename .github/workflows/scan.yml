name: Daily minors scan

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC = 5:17 AM Toronto (EDT), 4:17 AM in winter; ready before the 6:54 morning report
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Optional: only these leagues, space-separated (debug; does not overwrite latest.json)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: Run scan
        run: node src/scan.js ${{ github.event.inputs.leagues }}
      - name: Save results
        run: |
          git config user.name "whalers-scan"
          git config user.email "whalers-scan@users.noreply.github.com"
          git add -A data state
          git diff --cached --quiet || git commit -m "scan $(date -u +%F)"
          git push
